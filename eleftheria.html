<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon d'Eleftheria</title>
  <style>
    :root {
      --page-bg: #eef4f6;
      --grid-line: rgba(98,135,148,.12);
      --panel: #dfeaf0;
      --panel-light: #eef6f8;
      --blue: #6aa9c4;
      --blue-dark: #3f6473;
      --coral: #e8755f;
      --text: #405965;
      --muted: #7d99a5;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background-color: var(--page-bg);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    header {
      max-width: 1180px;
      margin: 28px auto 12px;
      padding: 30px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #DC7156 0%, #f0f3f4 30%, #f0f3f4 70%, #72a9c0 100%);
      border: 1px solid rgba(106,169,196,.28);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(34px, 6vw, 66px);
      line-height: .95;
      text-transform: uppercase;
      color: #15202a;
    }

    header p { margin: 10px 0 0; font-weight: 800; color: var(--blue-dark); }

    .container { max-width: 1180px; margin: 0 auto; padding: 0 24px 54px; }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toolbar a {
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid rgba(91,125,138,.2);
      color: var(--blue-dark);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .toolbar a.staff { background: var(--coral); color: white; border-color: transparent; }

    .dex-layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .pokemon-nav,
    .pokemon-sheet,
    .status {
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid rgba(91,125,138,.2);
    }

    .pokemon-nav {
      position: sticky;
      top: 14px;
      overflow: hidden;
    }

    .nav-head { padding: 14px; border-bottom: 1px solid rgba(91,125,138,.16); }
    .nav-head strong { display: block; margin-bottom: 9px; color: #15202a; font-family: Georgia, serif; font-size: 19px; }

    .nav-head input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid rgba(91,125,138,.2);
      background: var(--panel-light);
      color: var(--text);
      font: 700 13px Arial, sans-serif;
      outline: none;
    }

    .pokemon-list {
      max-height: calc(100vh - 230px);
      overflow: auto;
      padding: 7px;
    }

    .pokemon-tab {
      appearance: none;
      width: 100%;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease;
    }

    .pokemon-tab:hover { background: rgba(255,255,255,.36); transform: translateX(2px); }
    .pokemon-tab.active { background: var(--panel-light); box-shadow: inset 3px 0 0 var(--coral); }
    .pokemon-tab img { width: 42px; height: 42px; object-fit: contain; }
    .pokemon-tab span { min-width: 0; font-size: 12px; font-weight: 900; line-height: 1.15; }
    .pokemon-tab small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; text-transform: uppercase; }

    .pokemon-sheet { overflow: hidden; }

    .pokemon-hero {
      display: grid;
      grid-template-columns: minmax(180px, 250px) 1fr;
      align-items: center;
      gap: 24px;
      min-height: 275px;
      padding: 28px;
      background: linear-gradient(135deg, rgba(220,113,86,.12), rgba(255,255,255,.4) 50%, rgba(114,169,192,.17));
      border-bottom: 1px solid rgba(91,125,138,.16);
    }

    .sprite-wrap {
      display: grid;
      place-items: center;
      min-height: 220px;
      border-radius: 16px;
      background: rgba(255,255,255,.32);
      border: 1px solid rgba(255,255,255,.55);
    }

    .sprite-wrap img { width: min(210px, 100%); height: 210px; object-fit: contain; image-rendering: auto; }
    .pokemon-id { margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .pokemon-title { margin: 0; color: #15202a; font-family: Georgia, serif; font-size: clamp(30px, 5vw, 52px); line-height: .95; }

    .types { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
    .type-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 7px;
      color: white;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .moves-section { padding: 20px; }
    .moves-section > h2 { margin: 0 0 14px; color: #15202a; font: 900 25px Georgia, serif; }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .rank-card {
      padding: 13px;
      border-radius: 10px;
      background: rgba(255,255,255,.29);
      border: 1px solid rgba(91,125,138,.16);
    }

    .rank-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 9px;
      margin-bottom: 9px;
      border-bottom: 1px solid rgba(91,125,138,.13);
    }

    .rank-title strong { color: #15202a; font: 900 18px Georgia, serif; }
    .rank-title span { color: var(--muted); font-size: 9px; font-weight: 900; text-transform: uppercase; }

    .move-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .move {
      padding: 6px 8px;
      border-radius: 7px;
      background: var(--panel-light);
      border: 1px solid rgba(91,125,138,.14);
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 800;
    }

    .move-empty { color: var(--muted); font-size: 11px; font-style: italic; font-weight: 700; }

    .status { padding: 30px 20px; text-align: center; font-weight: 800; color: var(--muted); }
    .status strong { display: block; margin-bottom: 7px; color: var(--blue-dark); font-size: 15px; }
    .status code { display: inline-block; margin-top: 8px; padding: 5px 7px; border-radius: 6px; background: rgba(255,255,255,.4); color: var(--blue-dark); }

    @media (max-width: 820px) {
      header { margin: 12px; }
      .container { padding: 0 12px 32px; }
      .dex-layout { grid-template-columns: 1fr; }
      .pokemon-nav { position: static; }
      .pokemon-list { display: flex; max-height: none; overflow-x: auto; overflow-y: hidden; gap: 5px; }
      .pokemon-tab { width: 170px; flex: 0 0 170px; }
      .pokemon-hero { grid-template-columns: 1fr; text-align: center; }
      .types { justify-content: center; }
      .rank-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <h1>Pokémon d'Eleftheria</h1>
  <p>Encyclopédie des espèces et formes exclusives à la région</p>
</header>

<main class="container">
  <div class="toolbar">
    <a href="pokedex.html">Pokédex</a>
    <a class="staff" href="staff.html">Staff Tools</a>
    <a class="staff" href="rarete.html">Rareté</a>
  </div>

  <div id="status" class="status">Chargement de la base Eleftheria...</div>

  <div id="dexLayout" class="dex-layout" hidden>
    <aside class="pokemon-nav">
      <div class="nav-head">
        <strong>Pokémon</strong>
        <input id="pokemonSearch" type="search" placeholder="Rechercher..." autocomplete="off" />
      </div>
      <div id="pokemonList" class="pokemon-list"></div>
    </aside>

    <section id="pokemonSheet" class="pokemon-sheet"></section>
  </div>
</main>

<script>
/*
  GOOGLE SHEETS
  -------------
  1. Crée une feuille contenant ces colonnes :
     ID | Nom | Sprite | Type 1 | Type 2 | Attaques D | Attaques C | Attaques B | Attaques A | Attaques S | Attaques X
  2. Rends le Google Sheets accessible en lecture avec le lien.
  3. Remplace uniquement l'ID ci-dessous par celui présent dans l'URL de ton Google Sheets.
*/
const ELEFTHERIA_SHEET_ID = "1bb7KT45-EObVCVdeNIEunQybEra8QejuHfx7X0Ii0vE";
const ELEFTHERIA_SHEET_NAME = "Fakemon";
const SHEET_URL = `https://opensheet.elk.sh/${ELEFTHERIA_SHEET_ID}/${encodeURIComponent(ELEFTHERIA_SHEET_NAME)}`;

const TYPE_COLORS = {
  normal: "#A8A77A", feu: "#EE8130", eau: "#6390F0", electrik: "#F7D02C",
  plante: "#7AC74C", glace: "#96D9D6", combat: "#C22E28", poison: "#A33EA1",
  sol: "#E2BF65", vol: "#A98FF3", psy: "#F95587", insecte: "#A6B91A",
  roche: "#B6A136", spectre: "#735797", dragon: "#6F35FC", tenebres: "#705746",
  acier: "#B7B7CE", fee: "#D685AD"
};
const TYPES_WITH_DARK_TEXT = new Set(["electrik", "glace", "sol", "acier"]);
const RANKS = ["D", "C", "B", "A", "S", "X"];

// Type de chaque attaque utilisée sur la page.
// Pour une nouvelle attaque, ajoute simplement : "nom attaque": "type"
const MOVE_TYPES = {
  "charge":"normal","gros yeux":"normal","mimi queue":"normal","vive attaque":"normal","griffe":"normal",
  "coup d boule":"normal","meteores":"normal","belier":"normal","rengorgement":"normal","plaquage":"normal",
  "damocles":"normal","megaphone":"normal","facade":"normal","ultralaser":"normal","giga impact":"normal",
  "dernier recours":"normal","grincement":"normal",
  "flammeche":"feu","calcination":"feu","rebondifeu":"feu","lance flammes":"feu","surchauffe":"feu",
  "canicule":"feu","boutefeu":"feu","deflagration":"feu","feu follet":"feu",
  "ecume":"eau",
  "eclair":"electrik","cage eclair":"electrik","etincelle":"electrik","electro ball":"electrik",
  "change eclair":"electrik","coup d jus":"electrik","tonnerre":"electrik","elecanon":"electrik","fatal foudre":"electrik",
  "fouet lianes":"plante","tranch herbe":"plante","vampigraine":"plante","feuille magik":"plante",
  "eco sphere":"plante","synthese":"plante","giga sangsue":"plante","tempete verte":"plante",
  "poudreuse":"glace","vent glace":"glace","crocs givre":"glace","eclats glace":"glace","grele":"glace",
  "laser glace":"glace","blizzard":"glace","glaciation":"glace","triple axel":"glace","onde boreale":"glace",
  "buee noire":"glace","brume":"glace","voile aurore":"glace", "souffle glacé":"glace",
  "eclate roc":"combat","balayage":"combat","detection":"combat","double pied":"combat","casse brique":"combat",
  "poing boost":"combat","riposte":"combat","vampi poing":"combat","pied voltige":"combat","close combat":"combat",
  "contre":"combat","gonflette":"combat","surpuissance":"combat","mitra poing":"combat","exploforce":"combat","lame sainte":"combat",
  "dard venin":"poison","acide":"poison","crocs venin":"poison","pics toxik":"poison","acidarmure":"poison",
  "direct toxik":"poison","toxik":"poison","bombe beurk":"poison","poison croix":"poison","detrikanon":"poison",
  "cradovague":"poison","puredpois":"poison",
  "jet de sable":"sol","coud boue":"sol","pietisol":"sol","tourbi sable":"sol","tunnel":"sol","telluriforce":"sol",
  "trepignement":"sol","seisme":"sol","cavalerie lourde":"sol","abime":"sol","boue bombe":"sol",
  "tornade":"vol","vent arriere":"vol","cru ailes":"vol","tranch air":"vol","lame d air":"vol","danse plumes":"vol",
  "vent violent":"vol","rapace":"vol","atterrissage":"vol","pique":"vol",
  "hate":"psy","plenitude":"psy",
  "secretion":"insecte","piqure":"insecte","survinsecte":"insecte","plaie croix":"insecte","papillodanse":"insecte",
  "bourdon":"insecte","toile gluante":"insecte","megacorne":"insecte","taillade":"insecte","vent argente":"insecte",
  "jet pierres":"roche","poliroche":"roche","tomberoche":"roche","eboulement":"roche","piege de roc":"roche",
  "pouvoir antique":"roche","lame de roc":"roche","boule roc":"roche","roc boulet":"roche","fracass tete":"roche",
  "rayon gemme":"roche","tempete de sable":"roche",
  "etonnement":"spectre","lechouille":"spectre","ombre nocturne":"spectre","onde folie":"spectre","depit":"spectre",
  "chatiment":"spectre","ombre portee":"spectre","ball ombre":"spectre","malediction":"spectre","hantise":"spectre",
  "poltergeist":"spectre","prelevement destin":"spectre","vent mauvais":"spectre",
  "draco souffle":"dragon","draco queue":"dragon","draco rage":"dragon","dracogriffe":"dragon","danse draco":"dragon",
  "draco choc":"dragon","colere":"dragon","dracocharge":"dragon","draco meteore":"dragon",
  "morsure":"tenebres","machouille":"tenebres","tranche nuit":"tenebres",
  "griffe acier":"acier","mur de fer":"acier","tete de fer":"acier","aiguisage":"acier","queue de fer":"acier",
  "tacle lourd":"acier","luminocanon":"acier","gyroballe":"acier",
  "vent feerique":"fee","vampibaiser":"fee","charme":"fee","doux baiser":"fee","eclat magique":"fee",
  "pouvoir lunaire":"fee","calinerie":"fee"
};

function moveType(move){
  const key = normalize(move)
    .replace(/[’']/g, " ")
    .replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  return MOVE_TYPES[key] || "";
}

function moveBadge(move){
  const type = moveType(move);
  if(!type) return `<span class="move">${escapeHtml(move)}</span>`;
  const background = TYPE_COLORS[type] || "#78909C";
  const color = TYPES_WITH_DARK_TEXT.has(type) ? "#263238" : "#FFFFFF";
  return `<span class="move" style="background:${background};border-color:${background};color:${color}">${escapeHtml(move)}</span>`;
}

let allPokemon = [];
let selectedPokemon = null;

function text(value){ return (value ?? "").toString().trim(); }
function normalize(value){
  return text(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
}
function escapeHtml(value){
  return text(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
}
function cleanRow(row){
  const clean = {};
  Object.keys(row || {}).forEach(key => clean[normalize(key)] = row[key]);
  return clean;
}
function field(p, ...names){
  for(const name of names){
    const value = p[normalize(name)];
    if(text(value)) return value;
  }
  return "";
}
function getId(p){ return field(p, "ID", "Numéro", "Numero") || "?"; }
function getName(p){ return field(p, "Nom", "French", "Name") || "Nom inconnu"; }
function getSprite(p){ return field(p, "Sprite", "Image", "URL Sprite", "Sprite URL"); }
function getType1(p){ return field(p, "Type 1", "Type1"); }
function getType2(p){ return field(p, "Type 2", "Type2"); }
function getMoves(p, rank){ return field(p, `Attaques ${rank}`, `Attaque ${rank}`, `Rang ${rank}`, rank); }

function splitMoves(value){
  return text(value)
    .split(/[;\n|]+/)
    .map(item => item.trim())
    .filter(Boolean);
}

function typeBadge(type){
  if(!text(type)) return "";
  const key = normalize(type).replace(/\s/g, "");
  const background = TYPE_COLORS[key] || "#78909C";
  const color = TYPES_WITH_DARK_TEXT.has(key) ? "#263238" : "#FFFFFF";
  return `<span class="type-badge" style="background:${background};color:${color}">${escapeHtml(type)}</span>`;
}

function renderPokemonList(){
  const query = normalize(document.getElementById("pokemonSearch").value);
  const filtered = allPokemon.filter(p => normalize(getName(p)).includes(query) || normalize(getId(p)).includes(query));
  const list = document.getElementById("pokemonList");

  if(!filtered.length){
    list.innerHTML = `<div style="padding:18px;text-align:center;color:var(--muted);font-size:12px;font-weight:800;">Aucun Pokémon trouvé.</div>`;
    return;
  }

  list.innerHTML = filtered.map(p => {
    const isActive = selectedPokemon === p;
    return `<button class="pokemon-tab${isActive ? " active" : ""}" type="button" data-pokemon-id="${escapeHtml(getId(p))}">
      <img src="${escapeHtml(getSprite(p))}" alt="" onerror="this.style.visibility='hidden'">
      <span>${escapeHtml(getName(p))}<small>#${escapeHtml(getId(p))}</small></span>
    </button>`;
  }).join("");

  list.querySelectorAll(".pokemon-tab").forEach((button, index) => {
    button.addEventListener("click", () => {
      const id = button.dataset.pokemonId;
      const pokemon = filtered.find(p => String(getId(p)) === String(id)) || filtered[index];
      if(pokemon) selectPokemon(pokemon);
    });
  });
}

function renderPokemon(p){
  const sheet = document.getElementById("pokemonSheet");
  const rankCards = RANKS.map(rank => {
    const moves = splitMoves(getMoves(p, rank));
    return `<article class="rank-card">
      <div class="rank-title"><strong>Rang ${rank}</strong><span>${moves.length} attaque${moves.length > 1 ? "s" : ""}</span></div>
      ${moves.length
        ? `<div class="move-list">${moves.map(move => moveBadge(move)).join("")}</div>`
        : `<div class="move-empty">Aucune attaque renseignée.</div>`}
    </article>`;
  }).join("");

  sheet.innerHTML = `
    <div class="pokemon-hero">
      <div class="sprite-wrap">
        <img src="${escapeHtml(getSprite(p))}" alt="${escapeHtml(getName(p))}" onerror="this.style.opacity='.2'">
      </div>
      <div>
        <div class="pokemon-id">Pokémon d'Eleftheria • #${escapeHtml(getId(p))}</div>
        <h2 class="pokemon-title">${escapeHtml(getName(p))}</h2>
        <div class="types">${typeBadge(getType1(p))}${typeBadge(getType2(p))}</div>
      </div>
    </div>
    <div class="moves-section">
      <h2>Attaques apprises</h2>
      <div class="rank-grid">${rankCards}</div>
    </div>`;
}

function selectPokemon(p){
  selectedPokemon = p;
  renderPokemonList();
  renderPokemon(p);
}

async function load(){
  const status = document.getElementById("status");
  const layout = document.getElementById("dexLayout");

  if(ELEFTHERIA_SHEET_ID === "REMPLACE_PAR_ID_GOOGLE_SHEETS"){
    status.innerHTML = `<strong>La page est prête : il reste à connecter ton Google Sheets.</strong>
      Dans <code>eleftheria.html</code>, remplace <code>REMPLACE_PAR_ID_GOOGLE_SHEETS</code> par l'ID de ta feuille.<br>
      Colonnes attendues : ID, Nom, Sprite, Type 1, Type 2, Attaques D, Attaques C, Attaques B, Attaques A, Attaques S, Attaques X.`;
    return;
  }

  try {
    const response = await fetch(SHEET_URL);
    if(!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
    const raw = await response.json();
    if(!Array.isArray(raw)) throw new Error("Le Google Sheets n'a pas renvoyé une liste exploitable.");

    allPokemon = raw.map(cleanRow).filter(p => text(getName(p)) && getName(p) !== "Nom inconnu");
    allPokemon.sort((a, b) => {
      const aId = Number(getId(a));
      const bId = Number(getId(b));
      if(Number.isFinite(aId) && Number.isFinite(bId)) return aId - bId;
      return getName(a).localeCompare(getName(b), "fr");
    });

    if(!allPokemon.length) throw new Error("Aucun Pokémon n'a été trouvé dans la feuille.");

    selectedPokemon = allPokemon[0];
    status.hidden = true;
    layout.hidden = false;
    renderPokemonList();
    renderPokemon(selectedPokemon);
  } catch(error){
    console.error(error);
    status.innerHTML = `<strong>Impossible de charger la base Eleftheria.</strong>${escapeHtml(error.message)}`;
  }
}

document.getElementById("pokemonSearch").addEventListener("input", renderPokemonList);
load();
</script>
</body>
</html>
