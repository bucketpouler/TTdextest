body {

button,
input,

/* HEADER */

.pokedex-header {
  position: relative;
  width: min(1180px, 100%);
  min-height: 145px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;

/* CONTENU */

.container {
  width: min(1180px, 100%);
  margin: 0 auto;

/* FILTRES */

.controls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 200px auto;
  gap: 9px;
  margin-bottom: 14px;
  padding: 12px;

}

.controls input,
.controls select,
.controls button {
  min-width: 0;
  min-height: 42px;
  padding: 9px 12px;

.controls input::placeholder {

}

.controls input:focus,
.controls select:focus {
  background: var(--pokedex-inner-hover);
}

.controls select {
  cursor: pointer;
}

.controls select option {
  background: var(--bg-fond);
  color: var(--txt-noir);
}

.controls button {
  cursor: pointer;
}

.controls button:hover {

  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));

}

}

.pokemon-id {

}

.types {

}

}

  border-radius: 8px;

  font-size: 13px;
  font-weight: 700;
  text-align: center;
}

/* MODALE */

.modal-bg {

}

.modal {

}

.info-block {

}

/* EVOLUTIONS */

.evolution-prev,

.evolution-chip img {

/* ZONES */

.zone-list {

.zone-tag {
  display: inline-flex;

  background: var(--bg-bleu-second);
  color: #fff;

  line-height: 1.15;
  font-weight: 800;

/* MEGA */

.mega-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

.mega-card {

  color: var(--txt-noir-neutre);
  text-align: center;
  font-size: 12px;
  font-weight: 700;

.mega-card > strong {
  display: block;
  color: var(--txt-noir);

  font-weight: 400;

.mega-card img {
  display: block;
  width: 82px;
  height: 82px;

  padding: 0;

/* SCROLLBAR MODALE */

.modal {
  scrollbar-width: thin;

.modal::-webkit-scrollbar {

}

.modal::-webkit-scrollbar-track {

}

.modal::-webkit-scrollbar-thumb {

  background: var(--bg-bleu-second);
}

/* RESPONSIVE */

@media (max-width: 680px) {
  body {
    padding: 12px;
  }

  .pokedex-header {
    min-height: 115px;
    margin-bottom: 10px;
  }

  .pokedex-header h1 {

    grid-template-columns: 1fr;

    padding: 14px;

    grid-template-columns: 1fr;

  }

  .header-sprites {

  }

  .info-grid {
    grid-template-columns: 1fr;

  .info-block.full-row {

@media (max-width: 390px) {

    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .card img {
    width: 78px;
    height: 78px;
  }

  .pokemon-name {
    font-size: 17px;
  }
}

<body>

  <h1>Pokédex</h1>
</header>

<main class="container">

  <div class="controls">
    <input id="searchInput" placeholder="Rechercher...">

    <select id="typeFilter">
      <option value="">Tous les types</option>
    </select>

    <button id="inaccessibleFilter" type="button">
      Pokémon inaccessibles
    </button>
  </div>

  <div id="pokedexGrid" class="grid">
    <div class="status">Chargement du Pokédex...</div>
  </div>

</main>

<div id="modalBg" class="modal-bg" onclick="closeModal(event)">
  <div class="modal">

    <button class="modal-close" onclick="hideModal()" aria-label="Fermer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6L18 18M18 6L6 18" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </button>

    <div id="modalContent"></div>

  </div>
</div>

<script>
const SHEET_URL = "https://opensheet.elk.sh/1_inTvzxt5GKfwj9OiofOH8kprf-fcjL6Jea0G1VzDww/Sheet1";

let allPokemon = [];
let showOnlyInaccessible = false;

function normalizeText(value){
  return (value || "").toString().trim();
}

function normalizeName(value){
  return normalizeText(value).toLowerCase();
}

function getPokemonName(p){
  return p.french || p.nom || p.name || "Nom inconnu";
}

function getPokemonKey(p){
  return normalizeName(getPokemonName(p));
}

function getType1(p){
  return p["type 1"] || p.type1 || "";
}

function getType2(p){
  return p["type 2"] || p.type2 || "";
}

const TYPE_COLORS = {
  normal: "#A8A77A",
  feu: "#EE8130",
  eau: "#6390F0",
  electrik: "#F7D02C",
  plante: "#7AC74C",
  glace: "#96D9D6",
  combat: "#C22E28",
  poison: "#A33EA1",
  sol: "#E2BF65",
  vol: "#A98FF3",
  psy: "#F95587",
  insecte: "#A6B91A",
  roche: "#B6A136",
  spectre: "#735797",
  dragon: "#6F35FC",
  tenebres: "#705746",
  acier: "#B7B7CE",
  fee: "#D685AD"
};

const TYPES_WITH_DARK_TEXT = new Set([
  "electrik",
  "glace",
  "sol",
  "acier"
]);

function normalizeTypeName(type){
  return normalizeText(type)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function typeBadge(type){
  if(!type) return "";

  const key = normalizeTypeName(type);
  const background = TYPE_COLORS[key] || "#78909C";
  const color = TYPES_WITH_DARK_TEXT.has(key) ? "#263238" : "#FFFFFF";

  return `<span class="type" style="background:${background};color:${color}">${type}</span>`;
}

function getZones(p){
  return normalizeText(p.zone)
    .split(/[;,]/)
    .map(z => z.trim())
    .filter(Boolean);
}

function isParadoxPokemon(p){
  return getZones(p).some(
    zone => normalizeName(zone) === "paradoxe"
  );
}

function getEvolutionCondition(p){
  return p.evolution_condition ||
    p["condition évolution"] ||
    p["condition evolution"] ||
    p.evolutioncondition ||
    "";
}

function hasZone(p){
  return getZones(p).length > 0;
}

function findPokemonByFrenchName(name){
  if(!name) return null;

  const target = normalizeName(name);

  return allPokemon.find(
    p => getPokemonKey(p) === target
  ) || null;
}

function getPreviousPokemon(p){
  return findPokemonByFrenchName(
    p.evolves_from_species
  );
}

function getDirectEvolutions(p){
  const name = getPokemonKey(p);

  return allPokemon.filter(
    candidate =>
      normalizeName(candidate.evolves_from_species) === name
  );
}

function hasAccessiblePreEvolution(p){
  const visited = new Set();
  let current = p;

  while(current){
    const currentKey = getPokemonKey(current);

    if(visited.has(currentKey)) return false;

    visited.add(currentKey);

    const previous = getPreviousPokemon(current);

    if(!previous) return false;
    if(hasZone(previous)) return true;

    current = previous;
  }

  return false;
}

function isInaccessiblePokemon(p){
  return !hasZone(p) &&
    !hasAccessiblePreEvolution(p);
}

async function load(){
  const res = await fetch(SHEET_URL);
  const raw = await res.json();

  if(!Array.isArray(raw)){
    throw new Error(
      "Le Google Sheet n'a pas renvoyé une liste exploitable."
    );
  }

  allPokemon = raw
    .map(row => {
      const clean = {};

      Object.keys(row).forEach(k => {
        clean[k.trim().toLowerCase()] = row[k];
      });

      return clean;
    })
    .filter(
      p => p.id || p.french || p.nom || p.name
    );

  fillTypeFilter(allPokemon);
  render(allPokemon);
}

function fillTypeFilter(data){
  const select =
    document.getElementById("typeFilter");

  const types = new Set();

  select.innerHTML =
    `<option value="">Tous les types</option>`;

  data.forEach(p => {
    const type1 = getType1(p);
    const type2 = getType2(p);

    if(type1) types.add(type1);
    if(type2) types.add(type2);
  });

  Array.from(types)
    .sort()
    .forEach(type => {
      const option =
        document.createElement("option");

      option.value = type;
      option.textContent = type;

      select.appendChild(option);
    });
}

function applyFilters(){
  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const selectedType =
    document
      .getElementById("typeFilter")
      .value;

  const filtered =
    allPokemon.filter(p => {

      const name =
        normalizeName(getPokemonName(p));

      const id =
        normalizeName(p.id);

      const type1 =
        getType1(p);

      const type2 =
        getType2(p);

      const matchesSearch =
        name.includes(search) ||
        id.includes(search);

      const matchesType =
        !selectedType ||
        type1 === selectedType ||
        type2 === selectedType;

      const matchesInaccessible =
        !showOnlyInaccessible ||
        isInaccessiblePokemon(p);

      return (
        matchesSearch &&
        matchesType &&
        matchesInaccessible
      );
    });

  render(filtered);
}

function render(data){
  const grid =
    document.getElementById("pokedexGrid");

  grid.innerHTML = "";

  if(!data.length){
    grid.innerHTML =
      `<div class="status">Aucun Pokémon trouvé.</div>`;
    return;
  }

  data.forEach(p => {
    const card =
      document.createElement("div");

    card.className = "card";

    card.onclick = () =>
      showPokemon(p);

    card.innerHTML = `
      <div class="pokemon-id">
        #${p.id || "?"}
      </div>

      <img
        src="${p.sprite || ""}"
        alt="${getPokemonName(p)}"
      >

      <div class="pokemon-name">
        ${getPokemonName(p)}
      </div>

      <div class="types">
        ${typeBadge(getType1(p))}
        ${typeBadge(getType2(p))}

        ${
          isParadoxPokemon(p)
            ? `<span class="tag">Paradoxe</span>`
            : ""
        }
      </div>
    `;

    grid.appendChild(card);
  });
}

function safeIdForInline(id){
  return String(id || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

function evolutionChip(pokemon){
  const condition =
    getEvolutionCondition(pokemon);

  return `
    <button
      class="evolution-chip"
      type="button"
      onclick="event.stopPropagation(); showPokemonById('${safeIdForInline(pokemon.id)}')"
    >

      <img
        src="${pokemon.sprite || ""}"
        alt="${getPokemonName(pokemon)}"
      >

      <span class="evolution-meta">

        <span class="evolution-name">
          ${getPokemonName(pokemon)}
        </span>

        ${
          condition
            ? `<span class="evolution-condition">${condition}</span>`
            : ""
        }

      </span>

    </button>
  `;
}

function showPokemonById(id){
  const pokemon =
    allPokemon.find(
      p => String(p.id) === String(id)
    );

  if(pokemon){
    showPokemon(pokemon);
  }
}

function toggleShiny(id){
  const pokemon =
    allPokemon.find(
      p => String(p.id) === String(id)
    );

  if(!pokemon || !pokemon.shiny) return;

  const sprite =
    document.getElementById(
      "modalPokemonSprite"
    );

  const toggle =
    document.getElementById(
      "shinyToggle"
    );

  const isShiny =
    sprite.dataset.shiny === "true";

  if(isShiny){
    sprite.src =
      pokemon.sprite || "";

    sprite.dataset.shiny =
      "false";

    toggle.classList.remove(
      "active"
    );

    toggle.title =
      "Afficher le shiny";
  } else {
    sprite.src =
      pokemon.shiny;

    sprite.dataset.shiny =
      "true";

    toggle.classList.add(
      "active"
    );

    toggle.title =
      "Afficher la version normale";
  }
}

function makeInfoBlock(
  title,
  content,
  className = ""
){
  if(!content) return "";

  const extraClass =
    className
      ? ` ${className}`
      : "";

  return `
    <div class="info-block${extraClass}">
      <strong>${title}</strong>
      ${content}
    </div>
  `;
}

function showPokemon(p){
  const name =
    getPokemonName(p);

  const type1 =
    getType1(p);

  const type2 =
    getType2(p);

  const previousPokemon =
    getPreviousPokemon(p);

  const nextEvolutions =
    getDirectEvolutions(p);

  const ownEvolutionCondition =
    getEvolutionCondition(p);

  const preEvolutionBlock =
    p.evolves_from_species
      ? makeInfoBlock(
          "Évolue depuis",
          `
          <div class="evolution-prev">
            ${
              previousPokemon
                ? evolutionChip(
                    previousPokemon
                  )
                : `<span>${p.evolves_from_species}</span>`
            }
          </div>
          `
        )
      : "";

  const descriptionBlock =
    p.flavor_text
      ? makeInfoBlock(
          "Description",
          p.flavor_text,
          "full-row"
        )
      : "";

  const evolutionBlock =
    nextEvolutions.length
      ? makeInfoBlock(
          `Évolution${nextEvolutions.length > 1 ? "s" : ""}`,
          `
          ${
            ownEvolutionCondition
              ? `<div style="margin-bottom:10px;font-size:12px;color:var(--txt-neutre);font-weight:700;display:none;">${ownEvolutionCondition}</div>`
              : ""
          }

          <div class="evolution-next-list">
            ${nextEvolutions
              .map(evolutionChip)
              .join("")}
          </div>
          `
        )
      : "";

  const zoneBlock =
    p.zone
      ? makeInfoBlock(
          "Zone disponible",
          `
          <div class="zone-list">
            ${getZones(p)
              .map(
                zone =>
                  `<span class="zone-tag">${zone}</span>`
              )
              .join("")}
          </div>
          `
        )
      : "";

  const megaCards = [

    p["mega_1_name"]
      ? `
        <div class="mega-card">

          <strong>
            ${p["mega_1_name"]}
          </strong>

          <img
            src="${p["mega_1_sprite"] || ""}"
            alt="${p["mega_1_name"]}"
          >

          <div class="types">
            ${typeBadge(
              p["mega_1_type_1"]
            )}

            ${typeBadge(
              p["mega_1_type_2"]
            )}
          </div>

        </div>
      `
      : "",

    p["mega_2_name"]
      ? `
        <div class="mega-card">

          <strong>
            ${p["mega_2_name"]}
          </strong>

          <img
            src="${p["mega_2_sprite"] || ""}"
            alt="${p["mega_2_name"]}"
          >

          <div class="types">
            ${typeBadge(
              p["mega_2_type_1"]
            )}

            ${typeBadge(
              p["mega_2_type_2"]
            )}
          </div>

        </div>
      `
      : ""

  ]
  .filter(Boolean)
  .join("");

  const megaBlock =
    megaCards
      ? makeInfoBlock(
          "Méga-évolutions",
          `<div class="mega-list">${megaCards}</div>`
        )
      : "";

  const infoBlocks = [
    descriptionBlock,
    preEvolutionBlock,
    zoneBlock,
    evolutionBlock,
    megaBlock
  ].filter(Boolean);

  document
    .getElementById("modalContent")
    .innerHTML = `

    <div class="modal-header">

      <div class="header-sprites">

        <img
          id="modalPokemonSprite"
          class="header-main-sprite"
          src="${p.sprite || ""}"
          alt="${name}"
          data-shiny="false"
        >

        ${
          p.shiny
            ? `
            <button
              class="header-shiny"
              id="shinyToggle"
              type="button"
              title="Afficher le shiny"
              onclick="toggleShiny('${safeIdForInline(p.id)}')"
            >
              ✨
            </button>
            `
            : ""
        }

      </div>

      <div>

        <div class="modal-id">
          #${p.id || "?"}
        </div>

        <h2 class="modal-title">
          ${name}
        </h2>

        <div class="types">
          ${typeBadge(type1)}
          ${typeBadge(type2)}

          ${
            isParadoxPokemon(p)
              ? `<span class="tag">Paradoxe</span>`
              : ""
          }
        </div>

      </div>

    </div>

    <div class="info-grid">
      ${infoBlocks.join("")}
    </div>
  `;

  document
    .getElementById("modalBg")
    .style.display = "flex";
}

function hideModal(){
  document
    .getElementById("modalBg")
    .style.display = "none";
}

function closeModal(event){
  if(event.target.id === "modalBg"){
    hideModal();
  }
}

function runTests(){
  const base = {
    id: "1",
    french: "Base",
    zone: "Forêt"
  };

  const evo = {
    id: "2",
    french: "Evo",
    evolves_from_species: "Base",
    zone: ""
  };

  const loopA = {
    id: "A",
    french: "Loop A",
    evolves_from_species: "Loop B",
    zone: ""
  };

  const loopB = {
    id: "B",
    french: "Loop B",
    evolves_from_species: "Loop A",
    zone: ""
  };

  const old = allPokemon;

  allPokemon = [
    base,
    evo,
    loopA,
    loopB
  ];

  console.assert(
    hasAccessiblePreEvolution(evo) === true,
    "Préévolution avec zone non détectée"
  );

  console.assert(
    isInaccessiblePokemon(evo) === false,
    "Évolution accessible marquée inaccessible"
  );

  console.assert(
    hasAccessiblePreEvolution(loopA) === false,
    "Cycle d'évolution non sécurisé"
  );

  console.assert(
    isInaccessiblePokemon(loopA) === true,
    "Cycle sans zone mal classé"
  );

  console.assert(
    getEvolutionCondition({
      evolution_condition:
        "Niveau 16"
    }) === "Niveau 16",
    "Condition évolution snake_case non détectée"
  );

  console.assert(
    getEvolutionCondition({
      "condition évolution":
        "Pierre Lune"
    }) === "Pierre Lune",
    "Condition évolution FR non détectée"
  );

  console.assert(
    makeInfoBlock(
      "Test",
      ""
    ) === "",
    "Bloc vide non ignoré"
  );

  allPokemon = old;

  console.info(
    "Tests Pokédex terminés."
  );
}

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    applyFilters
  );

document
  .getElementById("typeFilter")
  .addEventListener(
    "change",
    applyFilters
  );

document
  .getElementById("inaccessibleFilter")
  .addEventListener(
    "click",
    function(){
      showOnlyInaccessible =
        !showOnlyInaccessible;

      this.classList.toggle(
        "active",
        showOnlyInaccessible
      );

      applyFilters();
    }
  );

document.addEventListener(
  "keydown",
  function(event){
    if(event.key === "Escape"){
      hideModal();
    }
  }
);

runTests();

load().catch(error => {
  console.error(error);

  document
    .getElementById("pokedexGrid")
    .innerHTML =
      `<div class="status">Erreur de chargement du Pokédex.</div>`;
});
</script>

<script>
(function () {

  function applyThemisTheme() {
    var isDark = false;

    try {
      isDark =
        localStorage.getItem("themisTheme") === "dark";
    } catch (e) {}

    document.documentElement.classList.toggle(
      "night-mode",
      isDark
    );

    if (document.body) {
      document.body.classList.toggle(
        "night-mode",
        isDark
      );
    }
  }

  applyThemisTheme();

  window.addEventListener(
    "storage",
    function (event) {
      if (event.key === "themisTheme") {
        applyThemisTheme();
      }
    }
  );

})();
</script>
